<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">

  <!-- Background -->
  <rect width="256" height="256" fill="#181818" rx="32"/>

  <!-- Folder tab -->
  <rect x="28" y="48" width="68" height="22" fill="#2d5050" rx="7"/>

  <!-- Folder body -->
  <rect x="28" y="66" width="200" height="156" fill="#2d5050" rx="8"/>

  <!-- Terminal prompt centered in folder -->
  <text
    x="128" y="164"
    font-family="monospace"
    font-size="68"
    font-weight="bold"
    fill="#417070"
    text-anchor="middle">&#62;_</text>

  <!-- Magnifying glass centered exactly over the prompt text -->
  <!-- Lens -->
  <circle cx="128" cy="148" r="56" fill="#181818" fill-opacity="0.0"/>
  <circle cx="128" cy="148" r="56" fill="none" stroke="#5a9494" stroke-width="13"/>
  <!-- Very subtle lens tint -->
  <circle cx="128" cy="148" r="56" fill="#5a9494" fill-opacity="0.06"/>

  <!-- Handle bottom right -->
  <line x1="171" y1="191" x2="214" y2="234" stroke="#5a9494" stroke-width="14" stroke-linecap="round"/>

</svg>
